version: '3.8'

services:
  # 1. DATABASE POSTGRESQL (Auto-init tabel users, rooms, bookings)
  postgres:
    image: postgres:15-alpine
    container_name: smart_gs_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_gs_db}
      POSTGRES_USER: ${DB_USER:-smart_gs_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TelkomRegional3_GS2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/database_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart_gs_network

  # 2. SERVER KEYCLOAK (IAM / SSO + Auto Import Realm & Google Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: smart_gs_keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smart_gs_db}
      KC_DB_USERNAME: ${DB_USER:-smart_gs_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-TelkomRegional3_GS2026!}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_telkom_2026
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - smart_gs_network

  # 3. WEB FRONTEND SMART GS PORTAL (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_gs_frontend
    restart: always
    ports:
      - "${PORT:-14071}:80"
    depends_on:
      - keycloak
    networks:
      - smart_gs_network

networks:
  smart_gs_network:
    driver: bridge

volumes:
  postgres_data:
