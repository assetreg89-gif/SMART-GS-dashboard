kind: pipeline
type: docker
name: smart-gs-dashboard-pipeline

trigger:
  branch:
    - main
    - master
  event:
    - push
    - custom

steps:
  # Stage 1: Build & Test Frontend
  - name: build-frontend
    image: node:20-alpine
    environment:
      VITE_SUPABASE_URL:
        from_secret: VITE_SUPABASE_URL
      VITE_SUPABASE_ANON_KEY:
        from_secret: VITE_SUPABASE_ANON_KEY
      VITE_SHEETS_WEBAPP_URL:
        from_secret: VITE_SHEETS_WEBAPP_URL
    commands:
      - npm ci
      - npm run build

  # Stage 2: Deploy otomatis dengan Docker Compose di Server via SSH
  - name: deploy-via-docker-compose
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: SSH_HOST
      username:
        from_secret: SSH_USER
      key:
        from_secret: SSH_KEY
      port: 22
      script:
        - cd /var/www/SMART-GS-dashboard || cd ~/SMART-GS-dashboard || cd SMART-GS-dashboard
        - git pull origin main
        - docker compose down
        - docker compose up -d --build
    when:
      branch:
        - main
        - master
      event:
        - push
        - custom
