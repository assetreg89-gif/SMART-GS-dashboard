kind: pipeline
type: docker
name: smart-gs-dashboard-pipeline

trigger:
  branch:
    - main
    - master
  event:
    - push
    - custom

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  - name: deploy
    image: docker:29.8.1-cli-alpine3.24
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    environment:
      SMART_GS_ENV_FILE:
        from_secret: SMART_GS_ENV_FILE
    commands:
      - |
        set -eu
        umask 077
        printf '%s\n' "$SMART_GS_ENV_FILE" > .env
        trap 'rm -f .env' EXIT

        export COMPOSE_PROJECT_NAME=smart-gs
        docker version
        docker compose version
        docker compose config --quiet
        docker compose up -d --build --remove-orphans frontend

        container_id="$(docker compose ps -q frontend)"
        test -n "$container_id"
        for attempt in $(seq 1 30); do
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$container_id")"
          if [ "$status" = "healthy" ]; then
            exit 0
          fi
          if [ "$status" = "unhealthy" ]; then
            docker compose logs --no-color frontend
            exit 1
          fi
          sleep 2
        done
        docker compose logs --no-color frontend
        exit 1
