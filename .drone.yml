kind: pipeline
type: docker
name: smart-gs-dashboard-pipeline

trigger:
  branch:
    - main
    - master
  event:
    - push
    - custom

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  - name: deploy
    image: docker:cli
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    environment:
      VITE_AUTH_MODE:
        from_secret: VITE_AUTH_MODE
      VITE_KEYCLOAK_ISSUER:
        from_secret: VITE_KEYCLOAK_ISSUER
      VITE_KEYCLOAK_CLIENT_ID:
        from_secret: VITE_KEYCLOAK_CLIENT_ID
      VITE_KEYCLOAK_REDIRECT_URL:
        from_secret: VITE_KEYCLOAK_REDIRECT_URL
      VITE_SUPABASE_URL:
        from_secret: VITE_SUPABASE_URL
      VITE_SUPABASE_ANON_KEY:
        from_secret: VITE_SUPABASE_ANON_KEY
      VITE_SHEETS_WEBAPP_URL:
        from_secret: VITE_SHEETS_WEBAPP_URL
    commands:
      - apk add --no-cache docker-cli-compose
      - docker version
      - docker compose version
      - docker compose up -d --build --remove-orphans
      - docker image prune -f
